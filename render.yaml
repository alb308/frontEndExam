# Render Blueprint: one Node service that serves the built site and the API,
# with a persistent disk for the SQLite database (votes and sessions).
services:
  - type: web
    name: canvault
    runtime: node
    plan: starter # persistent disks need a paid instance
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: canvault-data
      mountPath: /var/data
      sizeGB: 1
