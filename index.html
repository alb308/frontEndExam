<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080a" />
    <meta name="description" content="CANVAULT — la collezione di lattine. Sfoglia, scopri e vota ogni lattina." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <style>
      /* Boot screen: painted straight from the HTML, replaced as soon as React renders. */
      html { background: #07080a; }
      .boot { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; background: #07080a; color: #f1f4ee; font: 700 22px/1 system-ui, sans-serif; letter-spacing: .04em; }
      .boot b { color: #a3ff12; }
      .boot__bars { display: flex; gap: 5px; height: 26px; align-items: center; }
      .boot__bars i { width: 5px; height: 26px; border-radius: 2px; background: #a3ff12; animation: boot .9s infinite ease-in-out; }
      .boot__bars i:nth-child(2) { animation-delay: .15s; }
      .boot__bars i:nth-child(3) { animation-delay: .3s; }
      @keyframes boot { 50% { transform: scaleY(.35); opacity: .5; } }
      @media (prefers-reduced-motion: reduce) { .boot__bars i { animation: none; } }
    </style>
    <title>CANVAULT</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Caricamento">
        <span class="boot__bars"><i></i><i></i><i></i></span>
        <span>CAN<b>VAULT</b></span>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
